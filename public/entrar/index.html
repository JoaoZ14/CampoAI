<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#17362d" />
    <meta name="description" content="Entre na sua conta AG Assist para ver plano, uso e dados da conta." />
    <title>Entrar — AG Assist</title>
    <link
      rel="icon"
      href="https://agassist.netlify.app/assets/Logo%20CampoLead%20(1)-Photoroom.png"
      type="image/png"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/planos/styles.css" />
    <link rel="stylesheet" href="/cadastro/styles.css" />
    <link rel="stylesheet" href="/shared/authForms.css" />
  </head>
  <body>
    <a class="skip-link" href="#login-form">Pular para o login</a>

    <header class="site-header">
      <div class="container site-header-inner">
        <a class="site-logo" href="https://agassist.netlify.app/" aria-label="AG Assist — início">
          <img
            src="https://agassist.netlify.app/assets/Logo%20CampoLead%20(1)-Photoroom.png"
            alt="AG Assist"
            width="200"
            height="54"
            decoding="async"
          />
          <span class="brand-text">AG Assist</span>
        </a>
        <nav class="site-nav" aria-label="Principal">
          <a class="site-nav-link" href="https://agassist.netlify.app/">Início</a>
          <a class="site-nav-link" href="/planos">Planos</a>
          <a class="site-nav-link" href="/cadastro">Cadastro</a>
          <a class="site-nav-link is-current" href="/entrar" aria-current="page">Entrar</a>
        </nav>
      </div>
    </header>

    <main class="page-main">
      <div class="container signup-wrap">
        <header class="hero signup-hero">
          <h1>Entrar na sua conta</h1>
          <p class="subtitle">
            Use Google ou e-mail para abrir a área do cliente — plano, limites e dados da conta.
            A Lida no WhatsApp continua funcionando sem este login.
          </p>
        </header>

        <div id="feedback" class="feedback" role="status" aria-live="polite" hidden></div>

        <form id="login-form" class="signup-form card-panel" novalidate>
          <h2>Acesso</h2>
          <button type="button" id="google-btn" class="btn-google">
            <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
              <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.4 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 8 3.1l5.7-5.7C34.2 6.1 29.4 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/>
              <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 16 19 12 24 12c3.1 0 5.8 1.2 8 3.1l5.7-5.7C34.2 6.1 29.4 4 24 4 16.3 4 9.6 8.3 6.3 14.7z"/>
              <path fill="#4CAF50" d="M24 44c5.2 0 10-2 13.6-5.2l-6.3-5.3C29.2 35.1 26.7 36 24 36c-5.3 0-9.7-3.6-11.3-8.4l-6.5 5C9.5 39.6 16.2 44 24 44z"/>
              <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-1.1 3.2-3.5 5.7-6.6 7.1l.1.1 6.3 5.3C36.7 41.3 44 36 44 24c0-1.3-.1-2.7-.4-3.5z"/>
            </svg>
            Continuar com Google
          </button>
          <p class="auth-divider">ou e-mail e senha</p>
          <label for="email">E-mail
            <input type="email" id="email" name="email" required autocomplete="username" placeholder="voce@email.com" />
          </label>
          <label for="password">Senha
            <input type="password" id="password" name="password" required minlength="6" autocomplete="current-password" />
          </label>
          <button type="submit" class="btn-primary">Entrar</button>
          <p class="auth-footnote">Ainda não tem conta? <a href="/cadastro">Criar conta grátis</a></p>
        </form>
      </div>
    </main>

    <script type="module" src="/entrar/app.js"></script>
  </body>
</html>
