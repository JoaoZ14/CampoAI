<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2a382a" />
    <title>AG Assist — Admin</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/planos/styles.css" />
    <link rel="stylesheet" href="/admin/styles.css" />
  </head>
  <body>
    <a href="#app-main" class="skip-link">Ir para o conteúdo</a>
    <div id="toast-root" class="toast-root" aria-live="polite"></div>

    <div id="view-app" class="admin-app">
      <div id="sidebar-backdrop" class="sidebar-backdrop" hidden aria-hidden="true"></div>
      <aside id="sidebar" class="sidebar" aria-label="Navegação principal">
        <div class="sidebar-brand">
          <img
            src="https://agassist.netlify.app/assets/Logo%20CampoLead%20(1)-Photoroom.png"
            alt=""
            width="140"
            height="38"
            decoding="async"
          />
          <span class="brand-text">AG Assist</span>
          <span class="sidebar-sub">Admin</span>
        </div>
        <nav class="side-nav" id="side-nav"></nav>
        <div class="sidebar-foot">
          <button type="button" id="btn-sidebar-toggle" class="btn btn-secondary sm sidebar-toggle">
            Fechar menu
          </button>
        </div>
      </aside>
      <div class="admin-body">
        <header class="topbar">
          <button type="button" id="btn-menu" class="btn-icon" aria-label="Abrir menu" aria-expanded="false" aria-controls="sidebar">☰</button>
          <div class="topbar-titles">
            <h1 id="page-title" class="topbar-title">Painel</h1>
            <p id="page-subtitle" class="muted small"></p>
          </div>
          <div class="topbar-actions">
            <span id="admin-email" class="admin-email muted small" title=""></span>
            <button type="button" id="btn-refresh" class="btn btn-secondary sm" aria-label="Atualizar dados">Atualizar</button>
            <button type="button" id="btn-logout" class="btn btn-secondary sm">Sair</button>
          </div>
        </header>
        <main id="app-main" class="app-main" tabindex="-1">
          <p class="muted">Verificando sessão…</p>
        </main>
      </div>
    </div>

    <dialog id="modal" class="admin-modal" aria-labelledby="modal-title">
      <div class="modal-head">
        <h2 id="modal-title"></h2>
        <button type="button" id="modal-close" class="btn-icon" aria-label="Fechar">×</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </dialog>

    <dialog id="drawer" class="admin-drawer" aria-labelledby="drawer-title">
      <div class="drawer-head">
        <h2 id="drawer-title"></h2>
        <button type="button" id="drawer-close" class="btn-icon" aria-label="Fechar">×</button>
      </div>
      <div id="drawer-body" class="drawer-body"></div>
    </dialog>

    <script type="module" src="/admin/app.js"></script>
  </body>
</html>
