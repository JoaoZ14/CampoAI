<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2a382a" />
    <title>Entrar — AGGI Admin</title>
    <link rel="icon" href="/brand/aggi-mark.png" type="image/png" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/planos/styles.css" />
    <link rel="stylesheet" href="/admin/styles.css" />
  </head>
  <body class="login-page">
    <div id="toast-root" class="toast-root" aria-live="polite"></div>

    <main class="login-wrap">
      <div class="card login-card">
        <div class="login-brand">
          <img
            src="/brand/aggi-lockup.png"
            alt="AGGI"
            width="148"
            height="48"
            decoding="async"
          />
        </div>
        <h1>Entrar no painel</h1>
        <p class="muted small">Acesso restrito a administradores autorizados.</p>
        <div id="login-gate-msg" class="gate-msg" hidden role="alert"></div>
        <form id="form-login" class="form">
          <label>
            E-mail
            <input type="email" name="email" autocomplete="username" required />
          </label>
          <label>
            Senha
            <input type="password" name="password" autocomplete="current-password" required />
          </label>
          <button type="submit" class="btn btn-primary">Entrar</button>
        </form>
      </div>
    </main>

    <script type="module" src="/admin/login.js"></script>
  </body>
</html>
